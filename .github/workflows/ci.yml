name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steeltrack
          POSTGRES_PASSWORD: steeltrack
          POSTGRES_DB: steeltrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U steeltrack" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://steeltrack:steeltrack@localhost:5432/steeltrack?schema=public
      AUTH_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Seed demo data (smoke test)
        run: npm run db:seed
